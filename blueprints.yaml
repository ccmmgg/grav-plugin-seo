name: "Beacon"
version: "3.1.0"
description: "Manage your site’s meta tags, Open Graph, Twitter Cards, and Schema.org JSON-LD structured data. Includes a live preview feature."
icon: "bullhorn"
testing: false
author:
  name: "Charlie"
homepage: "https://github.com/ccmmgg/grav-plugin-seo"
keywords: ["seo", "meta", "microdata", "schema", "open graph", "json-ld", "plugin"]
bugs: "https://github.com/ccmmgg/grav-plugin-seo/issues"
license: "MIT"
dependencies:
    - { name: grav, version: '>=1.7.0' }
    - { name: admin, version: '>=1.10.0' }

form:
  validation: strict
  fields:
    plugin_section:
      type: section
      title: General Settings
      underline: true
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    facebookid:
      type: text
      label: Facebook App ID
    twitterid:
      type: text
      label: Twitter ID
      placeholder: '@yourusername'
    twitter_default:
      type: toggle
      label: On page creation, enable twitter metadata?
      default: 1
      highlight: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
    facebook_default:
      type: toggle
      label: On page creation, enable facebook metadata?
      default: 1
      highlight: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED

    social_section:
      type: section
      title: Social Defaults
      underline: true
    default_description:
      type: textarea
      label: Default Description
      help: Fallback meta description / og:description for pages with no body content.
      placeholder: 'Recycled aggregates, base materials, and erosion control products serving Colorado.'
    default_social_image:
      type: text
      label: Default Social Image URL
      help: Fallback og:image / twitter:image. Local path (e.g. /user/images/og.jpg) or full URL both work.
      placeholder: '/user/images/og-default.jpg'

    article_section:
      type: section
      title: Article Schema Defaults
      underline: true
    publisher_name:
      type: text
      label: Publisher Name
      help: Used in Article JSON-LD when the page does not set publisher_name.
    publisher_logo:
      type: text
      label: Publisher Logo URL (path)
      help: Grav media path for the publisher logo, e.g. /user/images/logo.png
      placeholder: '/user/images/logo.png'
    default_author:
      type: text
      label: Default Author
      help: Fallback author for Article schema. Resolved after header.article.author and header.author.

    organization_global_section:
      type: section
      title: Global Organization
      underline: true
    organization_on_all_pages:
      type: toggle
      label: Emit Organization JSON-LD on every page
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    organization_defaults.name:
      type: text
      label: Organization Name
    organization_defaults.legalname:
      type: text
      label: Registered Legal Name
    organization_defaults.description:
      type: text
      label: Description
    organization_defaults.url:
      type: text
      label: Website URL
      placeholder: 'https://yoursite.com'
    organization_defaults.logo:
      type: text
      label: Logo URL
      placeholder: 'https://yoursite.com/logo.png'
    organization_defaults.email:
      type: email
      label: Email
    organization_defaults.phone:
      type: text
      label: Phone
    organization_defaults.streetaddress:
      type: text
      label: Street Address
    organization_defaults.city:
      type: text
      label: City
    organization_defaults.state:
      type: text
      label: State / Region
    organization_defaults.zipcode:
      type: text
      label: Postal Code
    organization_defaults.taxid:
      type: text
      label: Tax / Fiscal ID
    organization_defaults.vatid:
      type: text
      label: VAT ID
    organization_defaults.foundingDate:
      type: text
      label: Founding Year
      placeholder: '2010'
    organization_defaults.paymentAccepted:
      type: text
      label: Payment Accepted
      placeholder: 'Visa, Cash, Credit Card'

    microdata_section:
      type: section
      title: Microdata Settings
      underline: true
    md_columns:
      type: columns
      fields:
        mdcolumn1:
          type: column
          fields:
            article:
              type: toggle
              label: Enable Article Microdata
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool
            event:
              type: toggle
              label: Enable Event Microdata
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool
            restaurant:
              type: toggle
              label: Enable Restaurant Microdata
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool
            musicevent:
              type: toggle
              label: Enable Music Event Microdata
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool
            customjson:
              type: toggle
              label: Enable Custom Json Microdata
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool
        mdcolumn2:
          type: column
          fields:
            person:
              type: toggle
              label: Enable Person Microdata
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool
            organization:
              type: toggle
              label: Enable Organization Microdata
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool
            musicalbum:
              type: toggle
              label: Enable Music Album Microdata
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool
            product:
              type: toggle
              label: Enable Product Microdata
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool
        
